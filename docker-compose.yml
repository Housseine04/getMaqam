services:
  audio-processing:
    build: ./audio-processing
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - internal
  
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - audio-processing
    expose:
      - "8080"
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal: