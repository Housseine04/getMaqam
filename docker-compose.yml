services:
  audio-processing:
    build: ./audio-processing
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - internal
  
  backend:
    build: ./backend
    restart: unless-stopped
    container_name: getmaqam-backend
    environment:
      PORT: 8080
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - audio-processing
    expose:
      - "8080"
    networks:
      - internal
      - proxy-net

networks:
  internal:
  proxy-net:
    external: true
  
