spring.application.name=getMaqam

# dealing with local and cloud (deployment)
server.port=${PORT:8080}

# Cloud Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Settings
#prod. dev was update
spring.jpa.hibernate.ddl-auto=validate 
#prod. dev was true
spring.jpa.show-sql=false 
spring.jpa.properties.hibernate.format_sql=true

# Tell Spring Boot to trust Railway's secure HTTPS proxy
# Bypass CORS failure
server.forward-headers-strategy=native

# Global CORS Settings
# Comma-separated list of allowed origin patterns (wildcard supported for Vercel preview/production deployments)
# Can be overridden using CORS_ALLOWED_ORIGINS environment variable
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}


# Let the pool shrink to 0 so Neon can suspend
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.pool-name=maqam-pool

management.health.db.enabled=false
